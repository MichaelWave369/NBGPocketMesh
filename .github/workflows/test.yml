name: E0 and E1-A experiments
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run demo
      - run: npm run demo:e1a
      - run: python -m py_compile scripts/e1b_lab.py scripts/e1b_dataset.py
      - run: python -m unittest discover -s tests_py -v
