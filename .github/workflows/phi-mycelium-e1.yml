name: PhiMycelium E1 experimental validation
on:
  pull_request:
  push:
    branches: [main, research/phi-mycelium-e1]
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Execute and replay all nine experimental stages
        run: node scripts/phi-mycelium-e1-report.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: phi-mycelium-e1-evidence
          path: e1-output/
          if-no-files-found: error
