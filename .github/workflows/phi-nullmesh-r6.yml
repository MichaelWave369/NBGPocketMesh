name: PhiNullMesh R6 cross-language oracle
on: [push, pull_request]
permissions:
  contents: read
jobs:
  oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          node scripts/phi-nullmesh-r6.mjs > /tmp/r6-a.json
          node scripts/phi-nullmesh-r6.mjs > /tmp/r6-b.json
          cmp /tmp/r6-a.json /tmp/r6-b.json
          python scripts/phi_nullmesh_r6_oracle.py research/phi-nullmesh-r6/fixtures.json /tmp/r6-a.json
