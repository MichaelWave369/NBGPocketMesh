name: PhiNullMesh R3 metric-compatible transport
on: [push, pull_request]
permissions:
  contents: read
jobs:
  algebra:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node scripts/phi-nullmesh-r3.mjs > /tmp/r3-a.json
          node scripts/phi-nullmesh-r3.mjs > /tmp/r3-b.json
          cmp /tmp/r3-a.json /tmp/r3-b.json
          node -e 'const r=require("/tmp/r3-a.json");if(r.checks!==444||r.authority!=="NONE"||r.release!=="BLOCKED")process.exit(1);console.log(JSON.stringify(r,null,2))'
